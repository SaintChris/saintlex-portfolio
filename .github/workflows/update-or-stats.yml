name: Update OpenRouter Stats

on:
  schedule:
    # Every hour
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  update-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Fetch OpenRouter stats
        env:
          OPENROUTER_MANAGEMENT_KEY: ${{ secrets.OPENROUTER_MANAGEMENT_KEY }}
        run: |
          python3 scripts/fetch_or_stats.py > /tmp/or_stats.html
          if [ ! -s /tmp/or_stats.html ]; then
            echo "ERROR: fetch_or_stats.py produced empty output"
            exit 1
          fi
          echo "Stats fetched successfully"
          wc -c /tmp/or_stats.html

      - name: Inject stats into index.html
        run: |
          python3 -c "
          import re, sys
          try:
              with open('/tmp/or_stats.html', 'r') as f:
                  stats_html = f.read()
              if not stats_html.strip():
                  print('ERROR: stats HTML is empty')
                  sys.exit(1)
              with open('index.html', 'r') as f:
                  content = f.read()
              if '<!-- OR-START -->' in content and '<!-- OR-END -->' in content:
                  pattern = r'<!-- OR-START -->.*?<!-- OR-END -->'
                  replacement = '<!-- OR-START -->' + stats_html + '<!-- OR-END -->'
                  content = re.sub(pattern, replacement, content, flags=re.DOTALL)
                  with open('index.html', 'w') as f:
                      f.write(content)
                  print('Stats injected successfully')
              else:
                  print('ERROR: OR markers not found in index.html')
                  sys.exit(1)
          except Exception as e:
              print(f'ERROR: {e}')
              sys.exit(1)
          "

      - name: Validate HTML
        continue-on-error: true
        run: |
          npm install -g html-validate 2>/dev/null || true
          html-validate index.html || true

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update OpenRouter live stats [$(date -u '+%Y-%m-%d %H:%M UTC')]"
            git push
          fi
