name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Validate HTML
        run: |
          npm install -g html-validate
          html-validate *.html articles/*.html

      - name: Check for broken links
        run: |
          npm install -g broken-link-checker
          echo "Skipping live link check in CI (static site)"
