name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run portfolio content tests
        run: python3 -m unittest tests/test_portfolio.py -v

      - name: Validate active HTML
        run: npx --yes html-validate index.html
